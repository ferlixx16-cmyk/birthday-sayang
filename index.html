<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday Sayang! 🎂</title>
  <style>
    body {
      background: linear-gradient(135deg, #ff9ecb, #ffcce0);
      text-align: center;
      font-family: 'Poppins', sans-serif;
      color: #fff;
      padding: 40px 20px;
    }
    h1 {
      font-size: 40px;
      color: #fff;
      text-shadow: 2px 2px 8px #ff69b4;
      animation: bounce 2s infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .gift {
      width: 220px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      margin: 20px 0;
      border: 4px solid #fff;
    }
    .message {
      background: rgba(255,255,255,0.25);
      padding: 25px;
      border-radius: 20px;
      max-width: 500px;
      margin: auto;
      font-size: 18px;
      line-height: 1.6;
    }
    .balloons { font-size: 45px; }
    .heart { color: #ff1493; font-size: 30px; }
  </style>
</head>
<body>
  <div class="balloons">🎈</div>
  <h1>Happy Birthday Sayang! 🥳</h1>
  <div class="heart">❤️</div>
  
  <img class="gift" src="foto-sayang.jpg" alt="Foto Sayang">
  
  <div class="message">
    <p>Untuk kamu, orang paling spesial 💖<br>
    Selamat ulang tahun ya Sayang<br>
    Semoga di umur baru ini semua doa & mimpi kamu jadi kenyataan<br>
    Makasih udah selalu ada. Aku sayang kamu banget!<br>
    Panjang umur, sehat, bahagia selalu yaa 🥰</p>
  </div>

  <audio autoplay loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
  </audio>
  
  <p style="margin-top:30px;">Klik play kalau musiknya gak otomatis ya 🎶</p>
</body>
</html>
